<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hill Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Live Clock (Bottom Right) -->
    <div class="clock-container">
        <span id="live-clock"></span>
    </div>

    <!-- Sky & Video -->
    <div class="sky" id="sky">
        <video id="bg-video" class="hidden">
            <source src="videos/intro_video.mp4" type="video/mp4">
            Your browser does not support this video.
        </video>

        <!-- Ring  -->
        <div class="ring-container">
            <div class="ring" id="ring" onclick="toggleLoginAndVideo()"></div>
        </div> 
    </div>

    <!-- Ground and Grass -->
    <div class="ground">
        <div class="grass"></div> 
    </div>

    <!-- Ai Prompt: Yüzük ile Login menüsünü nasıl çalıştırırım ve fade animasyonu eklerim -->

    <!-- Login Box  -->
    <div class="login-container hidden form-element" id="login-container">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>

    <script>
        let isRotated = false;
        let isFormHidden = false; // 'H' tuşunun durumunu takip et

        function toggleLoginAndVideo() {
            let video = document.getElementById("bg-video");
            let ring = document.getElementById("ring");
            let loginBox = document.getElementById("login-container");
            let sky = document.getElementById("sky");

            // Eğer 'H' tuşu ile form gizlendiyse, açılmasını engelle
            if (isFormHidden) return;

            if (!video.classList.contains("hidden")) {
                video.pause();
                video.classList.add("hidden");

                sky.style.backgroundImage = "url('images/background.png')";

                isRotated = false;
                ring.style.transform = "rotateY(0deg)";

                loginBox.classList.remove("fade-in");
                loginBox.classList.add("fade-out");

                setTimeout(() => {
                    loginBox.classList.add("hidden");
                }, 500);
            } else {
                video.classList.remove("hidden"); 
                video.play().catch(error => {
                    console.log("Autoplay failed:", error);
                });

                sky.style.backgroundImage = "none";

                if (!isRotated) {
                    ring.style.transform = "rotateY(360deg)";
                    isRotated = true;
                }

                loginBox.classList.remove("hidden", "fade-out");
                loginBox.classList.add("fade-in");

                video.onended = function() {
                    video.classList.add("hidden");
                    sky.style.backgroundImage = "url('images/background.png')";
                };
            }
        }

        // Update Live Clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Toggle Forms with 'H' Key (Fix Conflict with Ring)
        document.addEventListener("keydown", function(event) {
            if (event.key === "h" || event.key === "H") {
                document.querySelectorAll(".form-element").forEach(form => {
                    form.classList.toggle("hidden");
                });

                isFormHidden = !isFormHidden; // Gizlenme durumunu takip et
            }
        });
    </script>

</body>
</html>
