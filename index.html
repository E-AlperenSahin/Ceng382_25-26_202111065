<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hill Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Live Clock (Bottom Right) -->
    <div class="clock-container">
        <span id="live-clock"></span>
    </div>

    <!-- Sky & Video -->
    <div class="sky" id="sky">
        <video id="bg-video" class="hidden">
            <source src="videos/intro_video.mp4" type="video/mp4">
            Your browser does not support this video.
        </video>

        <!-- Ring (Only Controls Video & Background) -->
        <div class="ring-container">
            <div class="ring" id="ring" onclick="toggleVideo()"></div>
        </div> 
    </div>

    <!-- Ground and Grass -->
    <div class="ground">
        <div class="grass"></div> 
    </div>

    <!-- Ai Prompt: Yüzük sadece video ve arka planı değiştirsin, H tuşu login menüsünü açıp kapatsın -->

    <!-- Login Box -->
    <div class="login-container hidden form-element" id="login-container">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-button">Login</button>
        <p id="login-error" class="error-message hidden">Incorrect username or password!</p>
    </div>

    <script>
        let isRotated = false;
        let loginAttempts = []; // Array to store login data

        function toggleVideo() {
            let video = document.getElementById("bg-video");
            let ring = document.getElementById("ring");
            let sky = document.getElementById("sky");

            if (!video.classList.contains("hidden")) {
                video.pause();
                video.classList.add("hidden");
                sky.style.backgroundImage = "url('images/background.png')";
                isRotated = false;
                ring.style.transform = "rotateY(0deg)";
            } else {
                video.classList.remove("hidden"); 
                video.play().catch(error => {
                    console.log("Autoplay failed:", error);
                });

                sky.style.backgroundImage = "none";
                if (!isRotated) {
                    ring.style.transform = "rotateY(360deg)";
                    isRotated = true;
                }

                video.onended = function() {
                    video.classList.add("hidden");
                    sky.style.backgroundImage = "url('images/background.png')";
                };
            }
        }

        // 'H' Key to toggle login panel
        document.addEventListener("keydown", function(event) {
            if (event.key === "h" || event.key === "H") {
                let loginBox = document.getElementById("login-container");

                if (loginBox.classList.contains("hidden")) {
                    loginBox.classList.remove("hidden", "fade-out");
                    loginBox.classList.add("fade-in");
                } else {
                    loginBox.classList.remove("fade-in");
                    loginBox.classList.add("fade-out");

                    setTimeout(() => {
                        loginBox.classList.add("hidden");
                    }, 500);
                }
            }
        });

        // Login Function (Redirect if credentials match)
        function handleLogin() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let errorMsg = document.getElementById("login-error");

            if (username === "admin" && password === "admin") {
                console.log("Login successful! Redirecting to table.html...");
                window.location.href = "table.html"; // Redirect to table.html
            } else {
                errorMsg.classList.remove("hidden");
                console.log("Incorrect username or password.");
            }

            // Store login attempt (for debugging)
            if (username && password) {
                loginAttempts.push({ username, password });
                console.log("Login Attempts:", loginAttempts);
            }
        }

        // Update Live Clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Attach event listener to login button
        document.addEventListener("DOMContentLoaded", function () {
            let loginButton = document.getElementById("login-button");
            if (loginButton) {
                loginButton.addEventListener("click", handleLogin);
            }
        });
    </script>

</body>
</html>
