<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="tablestyle.css">
</head>
<body>

    <!-- Class Information Container -->
    <div class="class-container">
        <h1>Class Information</h1>

        <!-- Class Information Input Form -->
        <form id="class-form">
            <label for="class-name">Class Name:</label>
            <input type="text" id="class-name" required>

            <label for="num-people">Number of People:</label>
            <input type="number" id="num-people" required>

            <label for="description">Description:</label>
            <textarea id="description" required></textarea>

            <button type="submit">Add Class</button>
        </form>

        <!-- Class Information Table -->
        <table id="class-table">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th id="sort-num-people">Number of People ⬆⬇</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("class-form");
            const tableBody = document.querySelector("#class-table tbody");
            const sortNumPeople = document.getElementById("sort-num-people");
            let ascending = true; // Track sorting order

            // Form Submit Event:
            form.addEventListener("submit", function (event) {
                event.preventDefault(); // Prevent page reload

                // Get input values
                const className = document.getElementById("class-name").value;
                const numPeople = document.getElementById("num-people").value;
                const description = document.getElementById("description").value;

                // Create new table row
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${className}</td>
                    <td class="num-people">${numPeople}</td>
                    <td>${description}</td>
                `;

                //  Mouseover Event: on hover
                row.addEventListener("mouseover", function () {
                    this.style.backgroundColor = "#f0f0f0";
                });

                //  Mouseout Event:  mouse leaves
                row.addEventListener("mouseout", function () {
                    this.style.backgroundColor = "white";
                });

               
                tableBody.appendChild(row);

                
                form.reset();
            });
                //  Ai Prompt: Table'da Sıralama Nasıl Yapılabilir

            //  Sort by "Number of People"
            sortNumPeople.addEventListener("click", function () {
                const rows = Array.from(tableBody.querySelectorAll("tr"));

                rows.sort((a, b) => {
                    const numA = parseInt(a.querySelector(".num-people").textContent);
                    const numB = parseInt(b.querySelector(".num-people").textContent);
                    return ascending ? numA - numB : numB - numA;
                });

                // Toggle sorting order
                ascending = !ascending;

                // Clear and re-add sorted rows
                tableBody.innerHTML = "";
                rows.forEach(row => tableBody.appendChild(row));
            });
        });
    </script>

</body>
</html>
